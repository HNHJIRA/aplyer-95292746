name: Deploy to cPanel

on:
  push:
    branches: [main]
  workflow_dispatch: # allows manual trigger from the Actions tab

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Rebuild extension package
        run: |
          sudo apt-get update && sudo apt-get install -y zip unzip
          rm -f public/aplyer-extension.zip public/aplyer-extension.zip.b64 extension/aplyer-extension.zip
          cd extension && zip -r ../public/aplyer-extension.zip . \
            -x "aplyer-extension.zip" "extension-src/*" "extension-src"
          cd ..
          unzip -t public/aplyer-extension.zip | tail -5

      - name: Build static site
        # Vite reads VITE_SUPABASE_* from the committed .env file.
        # Do NOT pass them via `env:` here — unset GitHub secrets become empty
        # strings and would silently overwrite the .env values, producing a
        # bundle with no Supabase URL.
        run: bun run build:static

      - name: Verify Supabase URL was bundled
        run: |
          if ! grep -q 'supabase.co' dist/assets/*.js; then
            echo "✗ Supabase URL missing from bundle — .env not picked up at build time"
            exit 1
          fi
          echo "✓ Supabase URL present in bundle"

      - name: Verify encoded extension in static output
        run: |
          test -f dist/aplyer-extension.zip.b64
          test ! -f dist/aplyer-extension.zip
          base64 -d dist/aplyer-extension.zip.b64 > /tmp/verify-build.zip
          unzip -t /tmp/verify-build.zip | tail -3

      - name: Deploy to cPanel via binary-safe FTP
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER || secrets.SERVER }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get update && sudo apt-get install -y lftp
          lftp -c "
            set ftp:ssl-allow no;
            set ssl:verify-certificate no;
            set ftp:passive-mode true;
            set net:max-retries 3;
            set net:timeout 30;
            set xfer:clobber on;
            open -u \"$FTP_USER\",\"$FTP_PASS\" \"$FTP_SERVER\";
            mirror -R --verbose --delete-first --parallel=4 \
              --exclude-glob '.git*' \
              --exclude-glob 'node_modules/' \
              ./dist/ /;
          "

      - name: Verify live extension download source
        run: |
          curl -sI "https://${{ secrets.SITE_DOMAIN || 'aplyer.assuredtechno.com' }}/aplyer-extension.zip.b64"
          curl -s "https://${{ secrets.SITE_DOMAIN || 'aplyer.assuredtechno.com' }}/aplyer-extension.zip.b64" -o /tmp/verify.zip.b64
          base64 -d /tmp/verify.zip.b64 > /tmp/verify.zip
          unzip -t /tmp/verify.zip | tail -3
